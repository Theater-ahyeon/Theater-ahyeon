name: Refresh Phoebe profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: phoebe-profile-output
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate public statistics
        run: python scripts/build_cards.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Validate all assets
        run: python scripts/check_assets.py
      - name: Publish generated assets atomically
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/phoebe-output"
          if git fetch origin output; then
            git worktree add --detach "$target" FETCH_HEAD
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" switch --orphan profile-output
          fi
          cp dist/stats-*.svg dist/collaboration-*.svg dist/projects-*.svg dist/data.json "$target/"
          git -C "$target" add -- '*.svg' data.json
          if git -C "$target" diff --cached --quiet; then
            exit 0
          fi
          git -C "$target" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public profile statistics and merged PR contributions'
          git -C "$target" push origin HEAD:output
